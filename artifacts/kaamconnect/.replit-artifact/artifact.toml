kind = "web"
previewPath = "/"
title = "Carmio"
description = "A premium marketplace connecting people who need work with people who can do it, for trusted local and remote services."
version = "1.0.0"
id = "artifacts/kaamconnect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23938

[services.development]
run = "pnpm --filter @workspace/kaamconnect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kaamconnect", "run", "build" ]
serve = "static"
publicDir = "artifacts/kaamconnect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23938"
BASE_PATH = "/"
